    // 6. HELPER UTILITAS (FORMATTER, AUTO-SCORING RCTC, DRIVE EMBED, PDF)
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function ensurePeriod(text) {
      const t = text.trim();
      if (!t) return '';
      return /[.!?]$/.test(t) ? t : `${t}.`;
    }

    function formatRoleLine(roleText) {
      const t = roleText.trim();
      if (!t) return 'Bertindaklah sebagai [Isi Peran AI].';
      const hasPrefix = /^(bertindaklah sebagai|kamu adalah|anda adalah|berperanlah sebagai)/i.test(t);
      return ensurePeriod(hasPrefix ? t : `Bertindaklah sebagai ${t}`);
    }

    function buildRctcPromptText({ role, context, task, constraints }) {
      const r = formatRoleLine(role);
      const c = context.trim() ? ensurePeriod(context) : '[Isi informasi latar belakang yang relevan].';
      const t = task.trim() ? ensurePeriod(task) : '[Isi tugas yang harus dilakukan AI].';
      const cs = constraints.trim() ? ensurePeriod(constraints) : '[Isi batasan format, gaya bahasa, dan aturan output].';

      return [
        'PERAN (ROLE)',
        r,
        '',
        'KONTEKS (CONTEXT)',
        c,
        '',
        'TUGAS (TASK)',
        t,
        '',
        'BATASAN (CONSTRAINTS)',
        cs
      ].join('\n');
    }

    // Penilaian Otomatis R-C-T-C (Masing-masing 0-25 poin, Total 100 poin)
    function evaluateRctcScore({ role, context, task, constraints }) {
      const countWords = (s) => s.trim().split(/\s+/).filter(Boolean).length;

      // 1. Role (Max 25)
      const wRole = countWords(role);
      let sRole = 0;
      if (wRole >= 7) sRole = 25;
      else if (wRole === 6) sRole = 23;
      else if (wRole >= 4) sRole = 20;
      else if (wRole >= 2) sRole = 15;
      else if (wRole === 1) sRole = 9;

      // 2. Context (Max 25)
      const wCtx = countWords(context);
      let sCtx = 0;
      if (wCtx >= 20) sCtx = 25;
      else if (wCtx >= 14) sCtx = 22;
      else if (wCtx >= 8) sCtx = 18;
      else if (wCtx >= 4) sCtx = 13;
      else if (wCtx >= 1) sCtx = 7;

      // 3. Task (Max 25)
      const wTask = countWords(task);
      let sTask = 0;
      if (wTask >= 18) sTask = 25;
      else if (wTask >= 12) sTask = 22;
      else if (wTask >= 7) sTask = 18;
      else if (wTask >= 4) sTask = 13;
      else if (wTask >= 1) sTask = 7;

      // 4. Constraints (Max 25) - Menghargai jumlah kata & pemisah aturan (koma/titik koma)
      const wCons = countWords(constraints);
      const clauseCount = constraints.split(/[,;.\n]+/).filter((x) => x.trim().length > 2).length;
      let sCons = 0;
      if (wCons >= 15 || clauseCount >= 3) sCons = 25;
      else if (wCons >= 10 || clauseCount === 2) sCons = 22;
      else if (wCons >= 6) sCons = 18;
      else if (wCons >= 3) sCons = 13;
      else if (wCons >= 1) sCons = 7;

      const total = sRole + sCtx + sTask + sCons;
      let predikat = 'Perlu Dilengkapi';
      if (total >= 90) predikat = 'Sangat Baik (Master Prompt)';
      else if (total >= 75) predikat = 'Baik (Kompeten)';
      else if (total >= 50) predikat = 'Cukup (Berkembang)';

      return {
        skor_role: sRole,
        skor_context: sCtx,
        skor_task: sTask,
        skor_constraints: sCons,
        total_skor: total,
        predikat
      };
    }

    function getDriveEmbedUrl(rawUrl) {
      const url = (rawUrl || '').trim();
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/file/d/${match[1]}/preview`;
      }
      return url;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colors = {
        success: 'border-emerald-500/40 bg-slate-900 text-white',
        error: 'border-rose-500/40 bg-slate-900 text-white',
        info: 'border-indigo-500/40 bg-slate-900 text-white'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-circle',
        info: 'info'
      };
      const iconColors = {
        success: 'text-emerald-400',
        error: 'text-rose-400',
        info: 'text-indigo-400'
      };

      const el = document.createElement('div');
      el.className = `flex items-center gap-3 rounded-2xl border px-4 py-3 text-sm font-semibold shadow-2xl transition-all duration-300 ${colors[type] || colors.success}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || 'check-circle-2'}" class="h-5 w-5 shrink-0 ${iconColors[type] || 'text-emerald-400'}"></i>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(el);
      if (window.lucide) window.lucide.createIcons();

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    // -------------------------------------------------------------------------

    // -------------------------------------------------------------------------
    function renderKuisView() {
      const qSession = state.quizSession;

      // Layar Awal Kuis (Input Nama & Kelas Siswa)
      if (!qSession.started) {
        const availableCount = state.quizQuestions.length;
        const targetCount = Math.min(10, availableCount);

        return `
          <div class="mx-auto max-w-2xl">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-8">
              <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-400">
                <i data-lucide="help-circle" class="h-7 w-7"></i>
              </div>
              <h3 class="mt-4 text-xl font-extrabold text-slate-900 dark:text-white">
                Latihan Kuis Pilihan Ganda RCTC
              </h3>
              <p class="mt-1.5 text-sm text-slate-600 dark:text-slate-400">
                Sistem akan mengacak <strong>${targetCount} soal pilihan ganda</strong> secara otomatis untuk setiap peserta. Nilai langsung tercatat ke rekap guru setelah selesai.
              </p>

              ${
                availableCount === 0
                  ? `
                <div class="mt-6 rounded-xl border border-amber-300 bg-amber-50 p-4 text-xs font-semibold text-amber-900 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-200">
                  Belum ada soal di Bank Soal. Silakan minta Guru untuk menambahkan atau men-generate soal melalui menu Login Guru.
                </div>
              `
                  : `
                <div class="mt-6 space-y-4">
                  <div>
                    <label class="mb-1.5 block text-xs font-bold text-slate-700 dark:text-slate-300">Nama Lengkap Siswa *</label>
                    <input type="text" id="quiz-nama-input" value="${escapeHtml(qSession.nama_siswa || state.form.nama_siswa)}"
                      placeholder="Masukkan nama lengkap Anda"
                      class="pid-input w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm font-medium focus:border-indigo-600 focus:bg-white focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-white" />
                  </div>
                  <div>
                    <label class="mb-1.5 block text-xs font-bold text-slate-700 dark:text-slate-300">Kelas *</label>
                    <input type="text" id="quiz-kelas-input" value="${escapeHtml(qSession.kelas || state.form.kelas)}"
                      placeholder="Contoh: XI DKV 1"
                      class="pid-input w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm font-medium focus:border-indigo-600 focus:bg-white focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-white" />
                  </div>

                  <button type="button" onclick="window.app.startStudentQuiz()"
                    class="pid-btn mt-2 flex w-full items-center justify-center gap-2 rounded-2xl bg-indigo-600 px-6 py-3.5 text-base font-extrabold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-700">
                    <i data-lucide="play" class="h-5 w-5"></i>
                    <span>Mulai Kuis (${targetCount} Soal Acak)</span>
                  </button>
                </div>
              `
              }
            </div>
          </div>
        `;
      }

      // Layar Hasil Akhir Kuis Siswa
      if (qSession.finished) {
        return `
          <div class="mx-auto max-w-3xl space-y-6">
            <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-8">
              <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3.5 py-1 text-xs font-extrabold text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300">
                <i data-lucide="check-circle-2" class="h-4 w-4"></i>
                Kuis Selesai & Nilai Tersimpan
              </span>
              <h3 class="mt-3 text-xl font-extrabold text-slate-900 dark:text-white">${escapeHtml(qSession.nama_siswa)} (${escapeHtml(qSession.kelas)})</h3>
              <div class="my-5 inline-flex flex-col items-center justify-center rounded-3xl bg-indigo-50 px-10 py-6 dark:bg-indigo-500/15">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-300">Skor Akhir Anda</span>
                <span class="mt-1 text-5xl font-extrabold text-indigo-700 dark:text-indigo-400">${qSession.score}</span>
                <span class="mt-1 text-xs font-semibold text-slate-600 dark:text-slate-300">
                  Benar ${qSession.correctCount} dari ${qSession.questions.length} soal
                </span>
              </div>

              <div class="flex flex-wrap justify-center gap-3">

                  <i data-lucide="rotate-ccw" class="h-4 w-4"></i>
                  Ulangi Kuis (Acak Soal Baru)
                </button>
                <button type="button" onclick="window.app.setTab('studio')"
                  class="pid-btn inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
                  Lanjut ke Praktik RCTC
                </button>
              </div>
            </div>

            <!-- Pembahasan Ringkas -->
            <div class="space-y-3">
              <h4 class="text-sm font-extrabold text-slate-900 dark:text-white">Ulasan Jawaban Anda:</h4>
              ${qSession.questions
                .map((q, idx) => {
                  const userAns = qSession.answers[idx] || '(Tidak dijawab)';
                  const isRight = userAns === q.answer;
                  return `
                  <div class="rounded-2xl border p-4 ${
                    isRight
                      ? 'border-emerald-200 bg-emerald-50/40 dark:border-emerald-500/30 dark:bg-emerald-500/10'
                      : 'border-rose-200 bg-rose-50/40 dark:border-rose-500/30 dark:bg-rose-500/10'
                  }">
                    <p class="text-sm font-bold text-slate-900 dark:text-white">${idx + 1}. ${escapeHtml(q.question)}</p>
                    <p class="mt-2 text-xs font-semibold ${isRight ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">
                      Jawaban Anda: ${escapeHtml(userAns)} ${isRight ? '✓' : '✗'}
                    </p>
                    ${
                      !isRight
                        ? `<p class="mt-1 text-xs font-bold text-emerald-700 dark:text-emerald-300">Kunci Benar: ${escapeHtml(q.answer)}</p>`
                        : ''
                    }
                  </div>
                `;
                })
                .join('')}
            </div>
          </div>

      // Layar Pengerjaan Soal Interaktif (PID & Mobile Friendly)
      const currentQ = qSession.questions[qSession.currentIndex];
      const selectedAns = qSession.answers[qSession.currentIndex];
      const letters = ['A', 'B', 'C', 'D'];

      return `
        <div class="mx-auto max-w-3xl space-y-5">
          <!-- Header Progres Kuis -->
          <div class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div>
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">${escapeHtml(qSession.nama_siswa)} • ${escapeHtml(qSession.kelas)}</span>
              <h3 class="text-base font-extrabold text-slate-900 dark:text-white">
                Soal ${qSession.currentIndex + 1} dari ${qSession.questions.length}
              </h3>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${qSession.questions
                .map((_, i) => {
                  const answered = Boolean(qSession.answers[i]);
                  const isCurrent = i === qSession.currentIndex;
                  return `
                  <button type="button" onclick="window.app.jumpToQuizQuestion(${i})"
                    class="h-9 w-9 rounded-xl text-xs font-extrabold transition ${
                      isCurrent
                        ? 'bg-indigo-600 text-white ring-2 ring-indigo-400'
                        : answered
                        ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/20 dark:text-emerald-300'
                        : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400'
                    }">
                    ${i + 1}
                  </button>
                `;
                })
                .join('')}
            </div>
          </div>

          <!-- Kartu Pertanyaan & Opsi Jawaban Besar -->
          <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-8">
            <p class="text-base font-extrabold leading-relaxed text-slate-900 dark:text-white sm:text-lg">
              ${escapeHtml(currentQ.question)}
            </p>

            <div class="mt-6 space-y-3">
              ${currentQ.shuffledOptions
                .map((opt, oIdx) => {
                  const isPicked = selectedAns === opt;
                  return `
                  <button type="button" onclick="window.app.selectQuizAnswer(${qSession.currentIndex}, ${oIdx})"
                    class="pid-btn flex w-full items-center gap-3.5 rounded-2xl border p-4 text-left transition ${
                      isPicked
                        ? 'border-indigo-600 bg-indigo-50 ring-2 ring-indigo-600/30 dark:border-indigo-500 dark:bg-indigo-500/20'

        if (!f.task.trim()) errors.task = 'Tugas (Task) wajib diisi.';

      async copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
      },

        const text = buildRctcPromptText(state.form);

        const text = buildRctcPromptText(state.form);
        const slug = (state.form.nama_siswa || 'rctc-prompt').toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${slug}-prompt.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('File TXT berhasil diunduh!', 'success');
      },

      // --- KUIS PILIHAN GANDA 10 SOAL ACAK ---
      startStudentQuiz() {
        const nama = (document.getElementById('quiz-nama-input')?.value || '').trim();
        const kelas = (document.getElementById('quiz-kelas-input')?.value || '').trim().toUpperCase();

        if (!nama || !kelas) {
          showToast('Masukkan Nama Lengkap dan Kelas sebelum memulai kuis.', 'error');
          return;
        }

        const randomizedPool = shuffleArray(state.quizQuestions)
          .slice(0, 10)
          .map((q) => ({
            ...q,
            shuffledOptions: shuffleArray(q.options || [])
          }));

        state.quizSession = {
          started: true,
          finished: false,
          nama_siswa: nama,
          kelas: kelas,
          questions: randomizedPool,
          answers: {},
          currentIndex: 0,
          score: 0,
          correctCount: 0
        };
        renderApp();
      },

      selectQuizAnswer(qIdx, optIdx) {
        const q = state.quizSession.questions[qIdx];
        if (!q) return;
        state.quizSession.answers[qIdx] = q.shuffledOptions[optIdx];
        renderApp();
      },

      jumpToQuizQuestion(idx) {
        state.quizSession.currentIndex = idx;
        renderApp();
      },

      prevQuizQuestion() {
        if (state.quizSession.currentIndex > 0) {
          state.quizSession.currentIndex--;
          renderApp();
        }
      },

      nextQuizQuestion() {
        if (state.quizSession.currentIndex < state.quizSession.questions.length - 1) {
          state.quizSession.currentIndex++;
          renderApp();
        }
      },

      async finishStudentQuiz() {
        const qs = state.quizSession;
        let benar = 0;
        qs.questions.forEach((q, idx) => {
          if (qs.answers[idx] === q.answer) benar++;
        });
        const skor = Math.round((benar / qs.questions.length) * 100);

        state.quizSession.correctCount = benar;
        state.quizSession.score = skor;
        state.quizSession.finished = true;

        const resultRecord = {
          nama_siswa: qs.nama_siswa,
          kelas: qs.kelas,
          benar,
          total_soal: qs.questions.length,
          skor
        };

        if (IS_PREVIEW) {
          state.quizResults.unshift({
            id: `qres-${Date.now()}`,
            ...resultRecord,
            waktu: 'Baru saja'
          });
          showToast(`Kuis selesai! Skor Anda: ${skor}/100`, 'success');
          renderApp();
          return;
        }

        try {
          await addDoc(collection(db, 'quiz_results'), {
            ...resultRecord,
            created_at: serverTimestamp()
          });
          showToast(`Kuis selesai! Skor ${skor}/100 tersimpan ke rekap guru.`, 'success');
        } catch (err) {
          console.error(err);
          showToast('Skor dihitung, namun gagal tersimpan ke Firestore.', 'error');
        }
        renderApp();
      },

      resetQuizSession() {
        state.quizSession = {
          started: false,
          finished: false,
          nama_siswa: state.quizSession.nama_siswa,
          kelas: state.quizSession.kelas,
          questions: [],
          answers: {},
          currentIndex: 0,
          score: 0,
          correctCount: 0
        };
        renderApp();
      },

      generateAutoQuestions() {
        const topic = document.getElementById('gen-quiz-topic')?.value || 'SEMUA';
        const count = parseInt(document.getElementById('gen-quiz-count')?.value || '10', 10);

        const filteredPool =
          topic === 'SEMUA'
            ? AUTO_QUESTION_POOL
            : AUTO_QUESTION_POOL.filter((item) => item.topic === topic);

        const picked = shuffleArray(filteredPool).slice(0, count);
        state.generatedDraftQuestions = picked.map((q) => ({
          question: q.question,
          options: [...q.options],
          answer: q.answer
        }));

        renderApp();
        showToast(`${state.generatedDraftQuestions.length} soal otomatis siap diperiksa & disimpan!`, 'info');
      },

      async saveDraftQuestionsToBank() {
        if (state.generatedDraftQuestions.length === 0) return;

        if (IS_PREVIEW) {
          const added = state.generatedDraftQuestions.map((dq, i) => ({
            id: `auto-q-${Date.now()}-${i}`,
            ...dq
          }));
          state.quizQuestions = [...added, ...state.quizQuestions];
          state.generatedDraftQuestions = [];
          renderApp();
          showToast(`${added.length} soal berhasil ditambahkan ke Bank Soal!`, 'success');
          return;
        }

        try {
          for (const dq of state.generatedDraftQuestions) {
            await addDoc(collection(db, 'quiz_questions'), {
              question: dq.question,
              options: dq.options,
              answer: dq.answer,
              created_at: serverTimestamp()
            });
          }
          const totalAdded = state.generatedDraftQuestions.length;
          state.generatedDraftQuestions = [];
          renderApp();
          showToast(`${totalAdded} soal otomatis tersimpan ke Firestore!`, 'success');
        } catch (err) {
          showToast('Gagal menyimpan soal otomatis ke Firestore.', 'error');
        }
      },

      async handleAddManualQuestion(e) {
        e.preventDefault();
        const question = (document.getElementById('manual-q-text')?.value || '').trim();
        const optA = (document.getElementById('manual-opt-a')?.value || '').trim();
        const optB = (document.getElementById('manual-opt-b')?.value || '').trim();
        const optC = (document.getElementById('manual-opt-c')?.value || '').trim();
        const optD = (document.getElementById('manual-opt-d')?.value || '').trim();
        const ansKey = document.getElementById('manual-q-ans')?.value || 'A';

        const options = [optA, optB, optC, optD];
        const keyIndex = { A: 0, B: 1, C: 2, D: 3 }[ansKey] ?? 0;
        const answer = options[keyIndex];

        if (IS_PREVIEW) {
          state.quizQuestions.unshift({
            id: `man-q-${Date.now()}`,
            question,
            options,
            answer
          });
          renderApp();
          showToast('Soal manual berhasil ditambahkan!', 'success');
          return;
        }

        try {
          await addDoc(collection(db, 'quiz_questions'), {
            question,
            options,
            answer,
            created_at: serverTimestamp()
          });
          showToast('Soal manual tersimpan ke Firestore!', 'success');
        } catch (err) {
          showToast('Gagal menyimpan soal manual.', 'error');
        }
      },

      async deleteQuizQuestion(id) {
        if (IS_PREVIEW) {
          state.quizQuestions = state.quizQuestions.filter((q) => q.id !== id);
          renderApp();
          showToast('Soal dihapus.', 'info');
          return;
        }
        try {
          await deleteDoc(doc(db, 'quiz_questions', id));
          showToast('Soal dihapus dari Firestore.', 'info');
        } catch (err) {
          showToast('Gagal menghapus soal.', 'error');
        }
      },

      exportAllRctcPdf() {
        if (state.submissions.length === 0) {
          showToast('Belum ada data nilai RCTC untuk diexport.', 'error');
          return;
        }
        const headers = ['No', 'Nama Siswa', 'Kelas', 'Kategori', 'Role', 'Context', 'Task', 'Constr.', 'Total Skor'];
        const rows = state.submissions.map((s, i) => [
          i + 1,
          s.nama_siswa,
          s.kelas,
          s.kategori || 'Umum',
          `${s.skor_role}/25`,
          `${s.skor_context}/25`,
          `${s.skor_task}/25`,
          `${s.skor_constraints}/25`,
          `${s.total_skor}/100`
        ]);
        exportRekapPdf('REKAP NILAI PRAKTIK RCTC PROMPT GENERATOR', headers, rows, 'Rekap-Nilai-RCTC-Siswa.pdf');
      },

      exportAllQuizPdf() {
        if (state.quizResults.length === 0) {
          showToast('Belum ada data nilai kuis untuk diexport.', 'error');
          return;
        }
        const headers = ['No', 'Nama Siswa', 'Kelas', 'Jawaban Benar', 'Skor Akhir', 'Waktu'];
        const rows = state.quizResults.map((r, i) => [
          i + 1,
          r.nama_siswa,
          r.kelas,
          `${r.benar} / ${r.total_soal}`,
          `${r.skor}/100`,
          r.waktu || '-'
        ]);
        exportRekapPdf('REKAP NILAI KUIS PILIHAN GANDA RCTC', headers, rows, 'Rekap-Nilai-Kuis-RCTC.pdf');
      }
    };

    // Render Perdana
    renderApp();
  </script>
</body>
</html>
